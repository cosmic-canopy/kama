name: deploy-site
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', 'install.sh', 'install.ps1', 'tools/build-site']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh tools/build-site
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy _site --project-name=kama --branch=main
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
