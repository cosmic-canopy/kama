name: ci

on:
  push:
    branches: [main, dev]   # dev = long-lived integration branch: runs CI only.
    # Website (deploy-site.yml) is main+site-paths; releases (release.yml) are v* tags.
    # Neither triggers on dev, so pushing here builds + tests but ships nothing.
  pull_request:
    branches: [main]

concurrency:                 # cancel superseded runs on the same branch (rapid pushes)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # -Werror gates the primary Linux leg only (zero-warnings gate); macOS/Windows stay
          # ungated to avoid compiler/bison-version drift breaking CI — the code is identical
          # across legs, so any warning in portable code is still caught here.
          - { os: ubuntu-latest, name: linux-x64,   werror: "-Werror" }
          - { os: macos-14,      name: macos-arm64, werror: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Full history: tools/check-editors.sh resolves the commit `editor/zed/extension.toml` pins
      # (a shallow clone has only the tip, so any pin but HEAD looks like a bogus rev), and the site
      # generator dates sitemap <lastmod> from each page's last commit.
        with: { fetch-depth: 0 }

      - name: Install flex + bison (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flex bison make clang

      - name: Install flex + bison (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true   # drop the preinstalled untrusted tap (brew Tap-Trust); we don't use it
          brew install bison flex
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          # The Makefile auto-detects the keg-only bison at /opt/homebrew/opt/bison/bin.

      # -j4: the compiler is ~10 TUs and, since it started building at -O2, a serial build costs ~23 s
      # against ~13 s at -j4. Safe by the same evidence `dev` records — -j and serial builds produce
      # byte-identical objects. Capped at 4 rather than unbounded because the largest TU
      # (kama.cemit.cpp) peaks near 1.1 GB, and the smallest runner here is macos-14 at 3 cores / 7 GB.
      - name: Build
        run: make -j4 EXTRA_CXXFLAGS=${{ matrix.werror }}

      - name: Version
        run: ./kama --version

      - name: Test suite
        run: ./run_tests.sh

  windows-test:
    name: build + test (windows-x64)
    runs-on: windows-latest
    # std::fs/std::net's Windows branch (kama_os.h Winsock/CRT) can only be verified here — it has no local
    # equivalent on the Linux/macOS dev boxes.
    #
    # No longer `continue-on-error`, as of 972 passed / 0 failed on real Windows hardware (2026-08-11,
    # msys2/UCRT64). It ran best-effort while it stabilized, which bought the triage room to work but also
    # meant a failure here changed nothing — and the state it was found in was 923/48. A leg that reports
    # without consequence is a leg whose failures get read as weather. This job now fails the run.
    #
    # ⚠️ That is not the same as blocking a merge: "required check" is a BRANCH-PROTECTION setting on
    # GitHub, not something a workflow file can assert. Add `build + test (windows-x64)` to the required
    # list for `dev`/`main` — the job's `name:`, which changed with this commit, is the string it matches.
    #
    # release.yml's Windows job stays best-effort ON PURPOSE — a release must not be blocked by it (the
    # macos-13 lesson its own comment records). Different question, different answer.
    defaults:
      run: { shell: 'msys2 {0}' }
    steps:
      - uses: actions/checkout@v5
      # Full history: tools/check-editors.sh resolves the commit `editor/zed/extension.toml` pins
      # (a shallow clone has only the tip, so any pin but HEAD looks like a bogus rev), and the site
      # generator dates sitemap <lastmod> from each page's last commit.
        with: { fetch-depth: 0 }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # `diffutils` and `git` are NOT in the msys2 base install, and a guard that cannot find `diff`
          # does not report a missing tool — it reports the comparison as FAILED. That is how
          # check-agents said "the binary's AGENTS.md differs from agents/AGENTS.md" on a tree where the
          # two were identical. tools/run-checks.sh now refuses to start without them, so this list and
          # that preflight are one fact stated twice on purpose: the list makes CI work, the preflight
          # makes a future omission say so.
          install: >-
            make bison flex diffutils git
            mingw-w64-ucrt-x86_64-clang
      - name: Build
        run: make -j4
      - name: Version
        run: ./kama --version
      - name: Test suite   # full suite incl. fs_* / net_* over the Windows kama_os.h branch
        run: ./run_tests.sh

  wasm:
    name: wasm (build + run every fixture under node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Full history: tools/check-editors.sh resolves the commit `editor/zed/extension.toml` pins
      # (a shallow clone has only the tip, so any pin but HEAD looks like a bogus rev), and the site
      # generator dates sitemap <lastmod> from each page's last commit.
        with: { fetch-depth: 0 }
      - run: sudo apt-get update && sudo apt-get install -y flex bison make clang
      - run: make -j4
      - uses: mymindstorm/setup-emsdk@v16
      - name: Quick smoke (arith -> wasm -> node == 42)
        # Into out/, not the repo root. Nothing a build generates belongs in the worktree — that is what
        # tools/check-clean-tree.sh holds down, and `out/` is the one ignored root (see .gitignore).
        run: |
          ./kama build tests/arith.kama -o out/ci-smoke/arith.js --target wasm --cc emcc
          test "$(node out/ci-smoke/arith.js; echo $?)" = "42"
      - name: Full wasm suite (every positive fixture built to wasm + run under node; net skipped)
        run: KAMA_WASM=1 ./run_tests.sh

  grammar:
    name: editor grammars (tree-sitter + TextMate) + site
    runs-on: ubuntu-latest
    # The build-test legs deliberately never `npm install`, which is why tools/check-syntax.sh has always
    # SKIPped there and why the tree-sitter guard would too. This is the one leg where both have teeth: it
    # installs the PINNED tree-sitter CLI from the lockfile (the pin is what makes the "generate is a
    # no-op" oracle meaningful) and the vscode-textmate tokenizer, then runs the whole-corpus parse.
    steps:
      - uses: actions/checkout@v5
      # Full history: tools/check-editors.sh resolves the commit `editor/zed/extension.toml` pins
      # (a shallow clone has only the tip, so any pin but HEAD looks like a bogus rev), and the site
      # generator dates sitemap <lastmod> from each page's last commit.
        with: { fetch-depth: 0 }
      - run: sudo apt-get update && sudo apt-get install -y flex bison make clang
      - run: make -j4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            tree-sitter-kama/package-lock.json
            editor/vscode/package-lock.json
            package-lock.json
      # NB: NOT --ignore-scripts. The tree-sitter CLI's binary is fetched by its install script, and with
      # scripts disabled node_modules/.bin/tree-sitter still exists as a JS shim that dies on first use
      # rather than being absent — so the guard's skip path would not even fire.
      - run: npm --prefix tree-sitter-kama ci
      - run: sh tools/check-treesitter.sh
      - run: npm --prefix editor/vscode ci
      - run: sh tools/check-syntax.sh
      - run: sh tools/check-syntax-drift.sh
      - run: sh tools/check-editors.sh
      # The site is rendered FROM docs/, and the generator hard-fails on a relative link that resolves
      # nowhere, a #anchor with no matching heading, or raw HTML in a doc. Running it here means a docs
      # edit that breaks a cross-reference fails the PR, not the deploy on main.
      - run: sh tools/build-site
