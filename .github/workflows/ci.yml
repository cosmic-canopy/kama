name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build + test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-14,      name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flex + bison (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flex bison make clang

      - name: Install flex + bison (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          # The Makefile auto-detects the keg-only bison at /opt/homebrew/opt/bison/bin.

      - name: Build
        run: make

      - name: Version
        run: ./cstar --version

      - name: Test suite (22 fixtures)
        run: ./run_tests.sh

  wasm-smoke:
    name: wasm smoke (emit + run under node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y flex bison make clang
      - run: make
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build a fixture to wasm and run it
        run: |
          ./cstar build tests/arith.cstar -o out.js --target wasm --cc emcc
          test "$(node out.js; echo $?)" = "42"
