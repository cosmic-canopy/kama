name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-x64,       extra: "" }
          - { os: ubuntu-24.04-arm, name: linux-arm64,     extra: "" }
          # One macOS UNIVERSAL2 artifact (arm64 + x86_64) built on the Apple-Silicon
          # runner — covers Intel Macs without the deprecated/unschedulable macos-13
          # Intel runner that used to hang every release.
          - { os: macos-14,         name: macos-universal, extra: "-arch arm64 -arch x86_64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version (from tag)
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install flex + bison (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flex bison make clang

      - name: Install flex + bison (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Build (version-stamped)
        run: make VERSION="$VERSION" EXTRA_CXXFLAGS="${{ matrix.extra }}"

      - name: Verify version stamp
        run: ./kama --version | grep -q "$VERSION"

      - name: Smoke (fixtures)
        run: ./run_tests.sh

      - name: Package
        shell: bash
        run: |
          PKG="kama-${{ matrix.name }}-v${VERSION}"
          mkdir -p "$PKG/bin" "$PKG/include"
          cp kama "$PKG/bin/kama"
          cp kama_runtime.h "$PKG/include/"
          cp LICENSE "$PKG/" 2>/dev/null || true
          cp GETTING_STARTED.md "$PKG/README.md" 2>/dev/null || true
          cat > "$PKG/install.sh" <<'EOS'
          #!/bin/sh
          # Install kama into a prefix (default /usr/local). kama finds its runtime
          # header via <prefix>/include/kama_runtime.h relative to the binary.
          set -e
          PREFIX="${1:-/usr/local}"
          install -d "$PREFIX/bin" "$PREFIX/include"
          install bin/kama "$PREFIX/bin/kama"
          install -m 644 include/kama_runtime.h "$PREFIX/include/kama_runtime.h"
          echo "installed kama to $PREFIX/bin (add it to PATH)"
          EOS
          chmod +x "$PKG/install.sh"
          tar czf "${PKG}.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: kama-${{ matrix.name }}
          path: kama-*.tar.gz

  windows:
    name: build windows-x64
    runs-on: windows-latest
    # Best-effort: a Windows failure must NEVER block the release (the macos-13
    # lesson). windows-latest runners are readily scheduled, so no hang risk; with
    # continue-on-error the publish job proceeds even if this build breaks.
    continue-on-error: true
    defaults:
      run: { shell: 'msys2 {0}' }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make bison flex
            mingw-w64-ucrt-x86_64-clang
      - name: Derive version (from tag)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build (version-stamped)
        run: make VERSION="$VERSION"
      - name: Verify version stamp
        run: ./kama --version | grep -q "$VERSION"
      - name: Smoke (fixtures)
        continue-on-error: true   # don't let test flakiness block packaging the built binary
        run: ./run_tests.sh
      - name: Package
        run: |
          PKG="kama-windows-x64-v${VERSION}"
          mkdir -p "$PKG/bin" "$PKG/include"
          cp kama.exe "$PKG/bin/kama.exe" 2>/dev/null || cp kama "$PKG/bin/kama.exe"
          cp kama_runtime.h "$PKG/include/"
          cp LICENSE "$PKG/" 2>/dev/null || true
          cp GETTING_STARTED.md "$PKG/README.md" 2>/dev/null || true
          tar czf "${PKG}.tar.gz" "$PKG"
      - uses: actions/upload-artifact@v4
        with: { name: kama-windows-x64, path: kama-*.tar.gz }

  vsix:
    name: package VSCode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: vsce package
        shell: bash
        run: |
          npm i -g @vscode/vsce
          cd editor/vscode
          vsce package --allow-missing-repository -o "../../kama-vscode-${GITHUB_REF_NAME#v}.vsix"
      - uses: actions/upload-artifact@v4
        with: { name: kama-vsix, path: kama-vscode-*.vsix }

  release:
    name: publish release
    # `windows` is continue-on-error, so it satisfies `needs` even if it fails —
    # its artifact is included when it succeeds, never blocks the release when it doesn't.
    needs: [build, windows, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kama-*.tar.gz
            dist/kama-vscode-*.vsix
          generate_release_notes: true
