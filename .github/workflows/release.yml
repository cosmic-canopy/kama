name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release

env:
  # Bundled-toolchain version for the "-bundled" installer variant (zero-dependency
  # `kama build`). Bumpable; uses zig's modern `zig-<arch>-<os>-<ver>` tarball naming.
  ZIG_VERSION: "0.15.2"

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-x64,       extra: "",                         zig: x86_64-linux }
          - { os: ubuntu-24.04-arm, name: linux-arm64,     extra: "",                         zig: aarch64-linux }
          # One macOS UNIVERSAL2 artifact (arm64 + x86_64). The bundled zig is arm64-only
          # (zig ships per-arch, not universal): the bundled macOS variant targets Apple
          # Silicon; Intel Macs without a compiler should use the slim build + Xcode CLT.
          - { os: macos-14,         name: macos-universal, extra: "-arch arm64 -arch x86_64", zig: aarch64-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Full history: tools/check-editors.sh resolves the commit `editor/zed/extension.toml` pins
      # (a shallow clone has only the tip, so any pin but HEAD looks like a bogus rev), and the site
      # generator dates sitemap <lastmod> from each page's last commit.
        with: { fetch-depth: 0 }

      - name: Derive version (from tag)
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install flex + bison (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flex bison make clang

      - name: Install flex + bison (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true   # drop the preinstalled untrusted tap (brew Tap-Trust); we don't use it
          brew install bison flex
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Build (version-stamped)
        run: make VERSION="$VERSION" EXTRA_CXXFLAGS="${{ matrix.extra }}"

      - name: Verify version stamp
        run: ./kama --version | grep -q "$VERSION"

      - name: Smoke (fixtures)
        run: ./run_tests.sh

      - name: Stage payload
        shell: bash
        run: |
          # Tarball tree == install prefix (~/.kama): bin/ include/ lib/kama/. kama
          # resolves its runtime header + stdlib relative to the binary, so a plain
          # extract + PATH works; the installer does exactly that.
          rm -rf payload && mkdir -p payload/bin payload/include payload/lib/kama
          cp kama payload/bin/kama
          # EVERY seam header, not a hand-kept pair: a module's `extern "kama_*.h"` is resolved against
          # this directory, so a missing one breaks that module in the released toolchain only. Naming
          # them individually had already dropped kama_fmt/time/log/app/ctrl/channel/isolate/atomic.
          cp kama_*.h payload/include/
          cp -R lib/std payload/lib/kama/std
          cp LICENSE payload/ 2>/dev/null || true
          cp docs/GETTING_STARTED.md payload/README.md 2>/dev/null || true

      - name: Package (slim)
        shell: bash
        run: |
          PKG="kama-${{ matrix.name }}-v${VERSION}"
          cp -R payload "$PKG"
          tar czf "${PKG}.tar.gz" "$PKG"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Package (bundled — adds zig cc)
        shell: bash
        continue-on-error: true   # a zig URL/version hiccup must not block the slim release
        run: |
          PKG="kama-${{ matrix.name }}-bundled-v${VERSION}"
          cp -R payload "$PKG"
          mkdir -p "$PKG/libexec/zig"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.zig }}-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar xf zig.tar.xz --strip-components=1 -C "$PKG/libexec/zig"
          tar czf "${PKG}.tar.gz" "$PKG"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: kama-${{ matrix.name }}
          path: kama-*.tar.gz*

  windows:
    name: build windows-x64
    runs-on: windows-latest
    # Best-effort: a Windows failure must NEVER block the release (the macos-13
    # lesson). windows-latest runners are readily scheduled, so no hang risk; with
    # continue-on-error the publish job proceeds even if this build breaks.
    continue-on-error: true
    defaults:
      run: { shell: 'msys2 {0}' }
    steps:
      - uses: actions/checkout@v5
      # Full history: tools/check-editors.sh resolves the commit `editor/zed/extension.toml` pins
      # (a shallow clone has only the tip, so any pin but HEAD looks like a bogus rev), and the site
      # generator dates sitemap <lastmod> from each page's last commit.
        with: { fetch-depth: 0 }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make bison flex unzip
            mingw-w64-ucrt-x86_64-clang
      - name: Derive version (from tag)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build (version-stamped)
        run: make VERSION="$VERSION"
      - name: Verify version stamp
        run: ./kama --version | grep -q "$VERSION"
      - name: Smoke (fixtures)
        continue-on-error: true   # don't let test flakiness block packaging the built binary
        run: ./run_tests.sh
      - name: Stage payload
        run: |
          rm -rf payload && mkdir -p payload/bin payload/include payload/lib/kama
          cp kama.exe payload/bin/kama.exe 2>/dev/null || cp kama payload/bin/kama.exe
          # EVERY seam header, not a hand-kept pair: a module's `extern "kama_*.h"` is resolved against
          # this directory, so a missing one breaks that module in the released toolchain only. Naming
          # them individually had already dropped kama_fmt/time/log/app/ctrl/channel/isolate/atomic.
          cp kama_*.h payload/include/
          cp -R lib/std payload/lib/kama/std
          cp LICENSE payload/ 2>/dev/null || true
          cp docs/GETTING_STARTED.md payload/README.md 2>/dev/null || true
      - name: Package (slim)
        run: |
          PKG="kama-windows-x64-v${VERSION}"
          cp -R payload "$PKG"
          tar czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
      - name: Package (bundled — adds zig cc)
        continue-on-error: true
        run: |
          PKG="kama-windows-x64-bundled-v${VERSION}"
          cp -R payload "$PKG"
          mkdir -p "$PKG/libexec/zig"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-windows-${ZIG_VERSION}.zip" -o zig.zip
          unzip -q zig.zip -d zigtmp
          mv zigtmp/zig-*/* "$PKG/libexec/zig/"
          tar czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
      - uses: actions/upload-artifact@v6
        with: { name: kama-windows-x64, path: kama-*.tar.gz* }

  vsix:
    name: package VSCode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Full history: tools/check-editors.sh resolves the commit `editor/zed/extension.toml` pins
      # (a shallow clone has only the tip, so any pin but HEAD looks like a bogus rev), and the site
      # generator dates sitemap <lastmod> from each page's last commit.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - name: vsce package
        shell: bash
        run: |
          npm i -g @vscode/vsce
          cd editor/vscode
          vsce package --allow-missing-repository -o "../../kama-vscode-${GITHUB_REF_NAME#v}.vsix"
      - uses: actions/upload-artifact@v6
        with: { name: kama-vsix, path: kama-vscode-*.vsix }

  publish-extension:
    name: publish VSCode extension
    needs: [vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { name: kama-vsix, path: . }
      - name: VS Code Marketplace
        continue-on-error: true   # skips cleanly until VSCE_PAT is configured
        env: { VSCE_PAT: "${{ secrets.VSCE_PAT }}" }
        run: |
          VSIX=$(ls kama-vscode-*.vsix)
          npx --yes @vscode/vsce publish --packagePath "$VSIX" -p "$VSCE_PAT"
      - name: Open VSX
        continue-on-error: true   # skips cleanly until OVSX_PAT is configured
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
        run: |
          VSIX=$(ls kama-vscode-*.vsix)
          npx --yes ovsx publish "$VSIX" -p "$OVSX_PAT"

  release:
    name: publish release
    # `windows` is continue-on-error, so it satisfies `needs` even if it fails —
    # its artifact is included when it succeeds, never blocks the release when it doesn't.
    needs: [build, windows, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/kama-*.tar.gz
            dist/kama-*.tar.gz.sha256
            dist/kama-vscode-*.vsix
          generate_release_notes: true
