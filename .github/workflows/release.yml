name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release

env:
  # Bundled-toolchain version for the "-bundled" installer variant (zero-dependency
  # `kama build`). Bumpable; uses zig's modern `zig-<arch>-<os>-<ver>` tarball naming.
  ZIG_VERSION: "0.15.2"

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-x64,       extra: "",                         zig: x86_64-linux }
          - { os: ubuntu-24.04-arm, name: linux-arm64,     extra: "",                         zig: aarch64-linux }
          # One macOS UNIVERSAL2 artifact (arm64 + x86_64). The bundled zig is arm64-only
          # (zig ships per-arch, not universal): the bundled macOS variant targets Apple
          # Silicon; Intel Macs without a compiler should use the slim build + Xcode CLT.
          - { os: macos-14,         name: macos-universal, extra: "-arch arm64 -arch x86_64", zig: aarch64-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Full history: tools/check-editors.sh resolves the commit `editor/zed/extension.toml` pins
      # (a shallow clone has only the tip, so any pin but HEAD looks like a bogus rev), and the site
      # generator dates sitemap <lastmod> from each page's last commit.
        with: { fetch-depth: 0 }

      - name: Derive version (from tag)
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install flex + bison (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flex bison make clang

      - name: Install flex + bison (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true   # drop the preinstalled untrusted tap (brew Tap-Trust); we don't use it
          brew install bison flex
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Build (version-stamped)
        run: make -j4 VERSION="$VERSION" EXTRA_CXXFLAGS="${{ matrix.extra }}"

      - name: Verify version stamp
        run: ./kama --version | grep -q "$VERSION"

      - name: Smoke (fixtures)
        run: ./run_tests.sh

      - name: Stage payload
        shell: bash
        run: |
          # Tarball tree == install prefix (~/.kama): bin/ include/ lib/kama/. kama
          # resolves its runtime header + stdlib relative to the binary, so a plain
          # extract + PATH works; the installer does exactly that.
          rm -rf payload && mkdir -p payload/bin payload/include payload/lib/kama
          cp kama payload/bin/kama
          # EVERY seam header, not a hand-kept pair: a module's `extern "kama_*.h"` is resolved against
          # this directory, so a missing one breaks that module in the released toolchain only. Naming
          # them individually had already dropped kama_fmt/time/log/app/ctrl/channel/isolate/atomic.
          cp include/kama_*.h payload/include/
          # ...and the LLDB value formatters, which the `*.h` glob above does not match. They are
          # found exe-relative beside the headers (`kama demangle --lldb-init`), so an install
          # without them debugs with raw C structs and no error anywhere to say why.
          cp include/kama_lldb.py payload/include/
          # The manifest travels WITH the tree it describes. `kama` resolves the stdlib to this
          # directory, so lib/kama/kama.json is what names the project `std` and its module map —
          # copy only lib/std and every `import std::…` fails in the released toolchain while every
          # local leg stays green. Same failure shape as the individually-named headers above.
          cp lib/kama.json payload/lib/kama/kama.json
          cp -R lib/std payload/lib/kama/std
          # The global prelude, for GO-TO-DEFINITION. `Optional`/`Result`/`Ordering` and the language
          # contracts are ordinary kama declarations that get EMBEDDED into the binary, so an install had
          # the definitions and no file to open them in. Shipping the source costs ~30 KB and is what
          # `builtinSourcePath` looks for beside the stdlib. The `std::memory` triad needs no line here:
          # it already ships under lib/std.
          cp -R prelude payload/lib/kama/prelude
          # Module `core` (the runtime capabilities) is embedded too, for the same reason; its source is
          # what `builtinSourcePath` opens for `<prelude>/core/core.kama`.
          cp -R lib/core payload/lib/kama/core
          cp LICENSE payload/ 2>/dev/null || true
          cp docs/GETTING_STARTED.md payload/README.md 2>/dev/null || true

      - name: Package (slim)
        shell: bash
        run: |
          PKG="kama-${{ matrix.name }}-v${VERSION}"
          cp -R payload "$PKG"
          tar czf "${PKG}.tar.gz" "$PKG"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Package (bundled — adds zig cc)
        shell: bash
        continue-on-error: true   # a zig URL/version hiccup must not block the slim release
        run: |
          PKG="kama-${{ matrix.name }}-bundled-v${VERSION}"
          cp -R payload "$PKG"
          mkdir -p "$PKG/libexec/zig"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.zig }}-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar xf zig.tar.xz --strip-components=1 -C "$PKG/libexec/zig"
          tar czf "${PKG}.tar.gz" "$PKG"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: kama-${{ matrix.name }}
          path: kama-*.tar.gz*

  windows:
    name: build windows-x64
    runs-on: windows-latest
    # Best-effort: a Windows failure must NEVER block the release (the macos-13
    # lesson). windows-latest runners are readily scheduled, so no hang risk; with
    # continue-on-error the publish job proceeds even if this build breaks.
    continue-on-error: true
    defaults:
      run: { shell: 'msys2 {0}' }
    steps:
      - uses: actions/checkout@v5
      # Full history: tools/check-editors.sh resolves the commit `editor/zed/extension.toml` pins
      # (a shallow clone has only the tip, so any pin but HEAD looks like a bogus rev), and the site
      # generator dates sitemap <lastmod> from each page's last commit.
        with: { fetch-depth: 0 }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # diffutils + git: not in the msys2 base install, and tools/run-checks.sh refuses to start
          # without them (see ci.yml for what their absence looked like before it did).
          install: >-
            make bison flex unzip diffutils git
            mingw-w64-ucrt-x86_64-clang
      - name: Derive version (from tag)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build (version-stamped)
        run: make -j4 VERSION="$VERSION"
      - name: Verify version stamp
        run: ./kama --version | grep -q "$VERSION"
      - name: Smoke (fixtures)
        continue-on-error: true   # don't let test flakiness block packaging the built binary
        run: ./run_tests.sh
      - name: Stage payload
        run: |
          rm -rf payload && mkdir -p payload/bin payload/include payload/lib/kama
          cp kama.exe payload/bin/kama.exe 2>/dev/null || cp kama payload/bin/kama.exe
          # EVERY seam header, not a hand-kept pair: a module's `extern "kama_*.h"` is resolved against
          # this directory, so a missing one breaks that module in the released toolchain only. Naming
          # them individually had already dropped kama_fmt/time/log/app/ctrl/channel/isolate/atomic.
          cp include/kama_*.h payload/include/
          # ...and the LLDB value formatters, which the `*.h` glob above does not match. They are
          # found exe-relative beside the headers (`kama demangle --lldb-init`), so an install
          # without them debugs with raw C structs and no error anywhere to say why.
          cp include/kama_lldb.py payload/include/
          # The manifest travels WITH the tree it describes. `kama` resolves the stdlib to this
          # directory, so lib/kama/kama.json is what names the project `std` and its module map —
          # copy only lib/std and every `import std::…` fails in the released toolchain while every
          # local leg stays green. Same failure shape as the individually-named headers above.
          cp lib/kama.json payload/lib/kama/kama.json
          cp -R lib/std payload/lib/kama/std
          # The global prelude, for GO-TO-DEFINITION. `Optional`/`Result`/`Ordering` and the language
          # contracts are ordinary kama declarations that get EMBEDDED into the binary, so an install had
          # the definitions and no file to open them in. Shipping the source costs ~30 KB and is what
          # `builtinSourcePath` looks for beside the stdlib. The `std::memory` triad needs no line here:
          # it already ships under lib/std.
          cp -R prelude payload/lib/kama/prelude
          # Module `core` (the runtime capabilities) is embedded too, for the same reason; its source is
          # what `builtinSourcePath` opens for `<prelude>/core/core.kama`.
          cp -R lib/core payload/lib/kama/core
          cp LICENSE payload/ 2>/dev/null || true
          cp docs/GETTING_STARTED.md payload/README.md 2>/dev/null || true
      - name: Package (slim)
        run: |
          PKG="kama-windows-x64-v${VERSION}"
          cp -R payload "$PKG"
          tar czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
      - name: Package (bundled — adds zig cc)
        continue-on-error: true
        run: |
          PKG="kama-windows-x64-bundled-v${VERSION}"
          cp -R payload "$PKG"
          mkdir -p "$PKG/libexec/zig"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-windows-${ZIG_VERSION}.zip" -o zig.zip
          unzip -q zig.zip -d zigtmp
          mv zigtmp/zig-*/* "$PKG/libexec/zig/"
          tar czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
      - uses: actions/upload-artifact@v6
        with: { name: kama-windows-x64, path: kama-*.tar.gz* }

  vsix:
    name: package VSCode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Full history: tools/check-editors.sh resolves the commit `editor/zed/extension.toml` pins
      # (a shallow clone has only the tip, so any pin but HEAD looks like a bogus rev), and the site
      # generator dates sitemap <lastmod> from each page's last commit.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - name: vsce package
        shell: bash
        run: |
          npm i -g @vscode/vsce
          cd editor/vscode
          # Named for the version a user actually INSTALLS — the one in package.json, which is what
          # vsce bakes into the manifest and what both marketplace listings show.
          #
          # ⚠️ Deliberately NOT the git tag. The extension and the compiler ship on separate clocks
          # (./VERSION vs editor/vscode/package.json, guarded independently by check-version.sh and
          # check-ext-version.sh), so naming the file after the tag produced `kama-vscode-0.9.117.vsix`
          # whose manifest said 0.3.0. That filename was the ONE place the two numbers were mixed, and
          # it is why they read as coupled when nothing in the build couples them.
          EXT_VERSION=$(node -p 'require("./package.json").version')
          vsce package --allow-missing-repository -o "../../kama-vscode-${EXT_VERSION}.vsix"
      - uses: actions/upload-artifact@v6
        with: { name: kama-vsix, path: kama-vscode-*.vsix }

  publish-extension:
    name: publish VSCode extension
    needs: [vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { name: kama-vsix, path: . }
      # ⚠️ Deliberately NOT `continue-on-error`. Both steps were, under the comment "skips cleanly
      # until VSCE_PAT is configured" — and they did far more than that: EVERY failure was swallowed,
      # including the one that actually happens. `vsce package` above takes its version from
      # editor/vscode/package.json, not from the tag, so a release whose extension was changed without
      # a version bump is rejected as already-published — and the job went green having published
      # nothing. A publish step that cannot fail is not a publish step.
      #
      # The three outcomes are now told apart, and two of them are VISIBLE rather than silent:
      #   no token          -> ::warning + skip   (the state the old comment described)
      #   already published -> ::warning + skip   (legitimate: a kama release that did not touch the
      #                                            extension; tools/check-ext-version.sh is what keeps
      #                                            this from meaning "you forgot to bump")
      #   anything else     -> the job FAILS
      - name: VS Code Marketplace
        env: { VSCE_PAT: "${{ secrets.VSCE_PAT }}" }
        run: |
          set -o pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning title=VS Code Marketplace::VSCE_PAT is not set — skipping the publish"
            exit 0
          fi
          VSIX=$(ls kama-vscode-*.vsix)
          if npx --yes @vscode/vsce publish --packagePath "$VSIX" -p "$VSCE_PAT" 2>&1 | tee vsce.log; then
            echo "published $VSIX to the VS Code Marketplace"
          else
            grep -qiE 'already exists|already published' vsce.log || exit 1
            echo "::warning title=VS Code Marketplace::this version is already published — nothing to do (bump editor/vscode/package.json to ship a change)"
          fi
      - name: Open VSX
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
        run: |
          set -o pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning title=Open VSX::OVSX_PAT is not set — skipping the publish"
            exit 0
          fi
          VSIX=$(ls kama-vscode-*.vsix)
          if npx --yes ovsx publish "$VSIX" -p "$OVSX_PAT" 2>&1 | tee ovsx.log; then
            echo "published $VSIX to Open VSX"
          else
            grep -qiE 'already exists|already published' ovsx.log || exit 1
            echo "::warning title=Open VSX::this version is already published — nothing to do (bump editor/vscode/package.json to ship a change)"
          fi

  release:
    name: publish release
    # `windows` is continue-on-error, so it satisfies `needs` even if it fails —
    # its artifact is included when it succeeds, never blocks the release when it doesn't.
    needs: [build, windows, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/kama-*.tar.gz
            dist/kama-*.tar.gz.sha256
            dist/kama-vscode-*.vsix
          generate_release_notes: true
