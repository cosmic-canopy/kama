id = "kama"
name = "Kama"
description = "Kama language support: syntax highlighting, outline, and the kama language server."
version = "0.1.0"
schema_version = 1
authors = ["the kama authors"]
repository = "https://github.com/cosmic-canopy/kama"

# The grammar lives in a SUBDIRECTORY of the main repo (Zed supports that via `path`), so it cannot drift
# from kama.l/kama.y behind a separate release cycle — see tools/check-treesitter.sh.
#
# ⚠️ Zed does NOT read the working tree. It runs `git init` + `git fetch --depth 1 origin <rev>`, so only
# COMMITTED grammar changes are visible to it, and `rev` must name a commit the remote will serve.
#
# ⚠️ `rev` must be a commit that actually CONTAINS tree-sitter-kama/. It is not a release tag today because
# no tag does: the grammar landed after v0.1.76. tools/check-editors.sh verifies this locally so a stale or
# mistyped rev fails the suite instead of failing silently in someone's editor. Bump it to the release tag
# once one is cut that includes the grammar.
[grammars.kama]
repository = "https://github.com/cosmic-canopy/kama"
rev = "f143f315f1dc582740a643de41afe242e510e6be"
path = "tree-sitter-kama"
