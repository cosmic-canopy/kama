id = "kama"
name = "Kama"
description = "Kama language support: syntax highlighting, outline, and the kama language server."
version = "0.1.0"
schema_version = 1
authors = ["the kama authors"]
repository = "https://github.com/cosmic-canopy/kama"

# The grammar lives in a SUBDIRECTORY of the main repo (Zed supports that via `path`), so it cannot drift
# from kama.l/kama.y behind a separate release cycle — see tools/check-treesitter.sh.
#
# ⚠️ Zed does NOT read the working tree. It runs `git init` + `git fetch --depth 1 origin <rev>`, so only
# COMMITTED grammar changes are visible to it, and `rev` must name a commit the remote will serve.
#
# ⚠️ `rev` must be a commit that actually CONTAINS tree-sitter-kama/, and it must be THE COMMIT THAT LAST
# CHANGED IT. Both are enforced by tools/check-editors.sh §2c/§2d, so a stale or mistyped rev fails the
# suite instead of failing silently in someone's editor — which is what happened before: this pin sat 16
# grammar changes behind, and `slot` and named match patterns stopped highlighting with nothing to say so.
#
# THE RULE: bump this whenever tree-sitter-kama/ changes — NOT on a VERSION bump. VERSION moves on any
# src/include/prelude/lib/agents/seed change (346 commits over the stale window, 16 of which touched the
# grammar); repointing on all of them would ship nothing and make the pin's movement meaningless.
#
#   rev = $(git log -1 --format=%H -- tree-sitter-kama)
#
# A grammar change is TWO commits — the change, then this pin — because a commit cannot name its own SHA.
# Pinning an unpushed commit is fine and normal: the pin travels in the same push as the grammar it names,
# so no PUBLISHED state ever points at something the remote cannot serve.
[grammars.kama]
repository = "https://github.com/cosmic-canopy/kama"
rev = "aa91c98c9b08e9b4d695230bfbef825de70e262b"
path = "tree-sitter-kama"
