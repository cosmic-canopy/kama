<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kama run</title>
<!--
  The page `kama run --target WASM` opens a program in when its project names no `shellFile` (src/webrun/, KR-377): a
  canvas filling the window, under emscripten's own name for a program's canvas (`#canvas`), and nothing else. The
  program's output is the terminal's, so the page keeps none. Emscripten's default page writes each line into a textarea
  and scrolls it, copying all the text before it every time: 20,000 lines took minutes there and 570 ms under node.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<script>var Module = { canvas: document.getElementById('canvas') };</script>
{{{ SCRIPT }}}
</body>
</html>
