<!doctype html>
<html lang="en" data-palette="crimson-dusk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="https://kama-lang.org/assets/logo.png">
<meta property="og:image:alt" content="The kama logo">
<meta property="og:site_name" content="kama">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0a0a0d">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/shippori-mincho-b1-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">{{jsonld}}
</head>
<body class="{{bodyClass}}">
{{nav}}
{{content}}
{{footer}}
{{scripts}}
</body>
</html>
